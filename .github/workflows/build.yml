# SPDX-License-Identifier: GPL-2.0-or-later
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The merge queue builds each group on a temporary gh-readonly-queue/* ref;
  # without this trigger no checks ever report there, so required checks would
  # hold every queued PR until the queue's response timeout.
  merge_group:
  # Dispatched on the `nightly` tag by nightly.yml (a tag pushed with the
  # workflow token cannot trigger a push run), and available for manual runs.
  workflow_dispatch:

# Building QEMU is expensive; let newer pushes cancel in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the emulator, then run the whole suite (tests/run-all.sh) against real
  # firmware: the latest stable community release, plus the rolling beta on
  # Linux so firmware-side changes surface early. The beta leg is
  # continue-on-error -- it moves daily outside this repo, so it reports but does
  # not block merges. --require-firmware fails the job if a firmware-driven test
  # skips, so a broken asset download can't pass silently; each test's outcome
  # is listed in the job summary.
  build-and-test:
    name: Build + tests (${{ matrix.os }}, ${{ matrix.firmware }} firmware)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.firmware == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            firmware: latest
          - os: macos-latest
            firmware: latest
          - os: ubuntu-latest
            firmware: beta
    steps:
      - name: Checkout (without submodules; we fetch QEMU shallowly)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libpng-dev flex bison \
            dosfstools mtools

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config glib pixman libpng meson

      - name: Install python-rtmidi for the CoreMIDI bridge test (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet python-rtmidi
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Bootstrap QEMU submodule
        run: ./scripts/bootstrap.sh

      - name: Integrate device models
        run: ./scripts/integrate.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Fetch firmware and build the SD image
        uses: ./.github/actions/test-assets
        with:
          firmware-release: ${{ matrix.firmware }}
          sd-card: "true"

      - name: Run the test suite
        run: ./tests/run-all.sh --require-firmware
        env:
          DELUGEMU_ARTIFACTS: build/scenario-artifacts

      - name: Upload test logs and scenario artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.firmware }}
          path: |
            build/test-logs
            build/scenario-artifacts
          if-no-files-found: ignore

  # Windows build runs under MSYS2/MinGW -- the same toolchain QEMU itself uses
  # for its official Windows binaries. The Bash build scripts run unmodified in
  # the MINGW64 shell (see docs/windows.md).
  build-windows:
    name: Build + tests (Windows/MSYS2, latest firmware)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout (without submodules; we fetch QEMU shallowly)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSYS2 (MINGW64) with build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zstd
            dosfstools
            mingw-w64-x86_64-mtools

      - name: Bootstrap QEMU submodule
        run: ./scripts/bootstrap.sh

      - name: Integrate device models
        run: ./scripts/integrate.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Fetch firmware
        uses: ./.github/actions/test-assets

      # The emulator-driving tests beyond boot use UNIX sockets and are not yet
      # run on Windows; the unit tests and control-map guard are host-neutral.
      - name: Run the test suite (Windows subset)
        run: ./tests/run-all.sh --require-firmware smoke unit geometry-sync boot

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: build/test-logs
          if-no-files-found: ignore

  # On a version tag (v*), build a self-contained, relocatable bundle for each
  # OS and attach it to the GitHub Release so users can download and run without
  # a build toolchain. See scripts/package.sh.
  #
  # The same jobs publish the rolling `nightly` prerelease when nightly.yml
  # dispatches this workflow on the `nightly` tag: version-stamped
  # nightly-YYYYMMDD-<sha>, overwriting the previous night's assets (asset
  # names carry no version), and never marked as the latest release.
  release-macos:
    name: Package + publish macOS bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/nightly'
    needs: build-and-test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (without submodules; we fetch QEMU shallowly)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies (macOS)
        run: brew install ninja pkg-config glib pixman libpng meson

      - name: Bootstrap QEMU submodule
        run: ./scripts/bootstrap.sh

      - name: Integrate device models
        run: ./scripts/integrate.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/tags/nightly" ]; then
            echo "RELEASE_VERSION=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Package relocatable bundle
        run: ./scripts/package.sh
        env:
          # Release tag stamped into the bundle (window title / About box).
          DELUGEMU_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Upload bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          # Nightly-only settings; each is '' on a version tag, which the action
          # treats as unset, so versioned releases publish exactly as before.
          prerelease: ${{ github.ref == 'refs/tags/nightly' && 'true' || '' }}
          make_latest: ${{ github.ref == 'refs/tags/nightly' && 'false' || '' }}
          name: ${{ github.ref == 'refs/tags/nightly' && 'Nightly build' || '' }}
          body: ${{ github.ref == 'refs/tags/nightly' && format('Automated build of main at {0} ({1}). Replaced every night when main changes; use a versioned release for anything you need to keep.', github.sha, env.RELEASE_VERSION) || '' }}
          files: |
            build/release/DelugEmu-macos-*.dmg
            build/release/DelugEmu-macos-*.tar.gz

  release-linux:
    name: Package + publish Linux bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/nightly'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (without submodules; we fetch QEMU shallowly)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ninja-build pkg-config python3-venv patchelf \
            libglib2.0-dev libpixman-1-dev libpng-dev flex bison

      - name: Bootstrap QEMU submodule
        run: ./scripts/bootstrap.sh

      - name: Integrate device models
        run: ./scripts/integrate.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/tags/nightly" ]; then
            echo "RELEASE_VERSION=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Package relocatable bundle
        run: ./scripts/package.sh
        env:
          DELUGEMU_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Upload bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          # Nightly-only settings; each is '' on a version tag, which the action
          # treats as unset, so versioned releases publish exactly as before.
          prerelease: ${{ github.ref == 'refs/tags/nightly' && 'true' || '' }}
          make_latest: ${{ github.ref == 'refs/tags/nightly' && 'false' || '' }}
          name: ${{ github.ref == 'refs/tags/nightly' && 'Nightly build' || '' }}
          body: ${{ github.ref == 'refs/tags/nightly' && format('Automated build of main at {0} ({1}). Replaced every night when main changes; use a versioned release for anything you need to keep.', github.sha, env.RELEASE_VERSION) || '' }}
          files: build/release/DelugEmu-linux-*.tar.gz

  release-windows:
    name: Package + publish Windows bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/nightly'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout (without submodules; we fetch QEMU shallowly)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSYS2 (MINGW64) with build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            ninja
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zstd
            dosfstools
            mingw-w64-x86_64-mtools

      - name: Bootstrap QEMU submodule
        run: ./scripts/bootstrap.sh

      - name: Integrate device models
        run: ./scripts/integrate.sh

      - name: Build
        run: ./scripts/build.sh

      # WiX CLI for the MSI installer built by package.sh. Pinned to the 5.x
      # series: WiX v7+ refuses to run (WIX7015) unless the Open Source
      # Maintenance Fee EULA is accepted, which is a project decision we have
      # not taken; 5.x has no such gate and matches the wxs authoring. The
      # Util extension must match the CLI's major version. Installed with the
      # Windows-native dotnet (outside MSYS2); package.sh finds it under
      # %USERPROFILE%\.dotnet\tools. Non-fatal: if this breaks, package.sh
      # warns and skips the MSI but the zip bundle must still publish.
      - name: Install WiX CLI
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          & $wix --version
          & $wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/tags/nightly" ]; then
            echo "RELEASE_VERSION=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Package relocatable bundle + MSI installer
        run: ./scripts/package.sh
        env:
          # MSI versions must grow monotonically for upgrades; the shallow CI
          # clone can't use the commit count, so use the workflow run number.
          DELUGEMU_MSI_VERSION: 1.0.${{ github.run_number }}
          DELUGEMU_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Upload bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          # Nightly-only settings; each is '' on a version tag, which the action
          # treats as unset, so versioned releases publish exactly as before.
          prerelease: ${{ github.ref == 'refs/tags/nightly' && 'true' || '' }}
          make_latest: ${{ github.ref == 'refs/tags/nightly' && 'false' || '' }}
          name: ${{ github.ref == 'refs/tags/nightly' && 'Nightly build' || '' }}
          body: ${{ github.ref == 'refs/tags/nightly' && format('Automated build of main at {0} ({1}). Replaced every night when main changes; use a versioned release for anything you need to keep.', github.sha, env.RELEASE_VERSION) || '' }}
          files: |
            build/release/DelugEmu-windows-*.zip
            build/release/DelugEmu-windows-*.msi
